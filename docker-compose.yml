services:
  db:
    image: postgres:17
    container_name: secure-message-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: secure_message
      POSTGRES_USER: secure_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_user -d secure_message"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: